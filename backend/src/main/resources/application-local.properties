# Local development profile: run with SPRING_PROFILES_ACTIVE=local (or -Dspring.profiles.active=local)
# Override any value with the matching env var, e.g. DB_PASS=yourpassword
spring.datasource.password=${DB_PASS:postgres}
spring.jpa.show-sql=true
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
app.admin.usernames=${ADMIN_USERNAMES:admin}
logging.level.com.prepmind=DEBUG
