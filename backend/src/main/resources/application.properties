spring.application.name=prep-api
server.port=8080
# Render sits behind a proxy: trust X-Forwarded-* from internal hops so client IPs are correct
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
# gzip JSON responses (the question list shrinks from ~60 KB to ~10 KB)
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=2KB

# ---------- Database ----------
# Required in production: DB_HOST, DB_NAME, DB_USER, DB_PASS (no password fallback on purpose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:interview_prep_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Security ----------
# Required: a random string of at least 32 characters (e.g. `openssl rand -base64 48`). The app refuses to start without it.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://interview-preparation-platform-roan.vercel.app}
# Comma-separated usernames made ADMIN at startup and on login (bootstrap only; it never removes a role).
# Everything else about roles (USER / EDITOR / ADMIN) is managed in the app's Admin panel.
app.admin.usernames=${ADMIN_USERNAMES:}
# OAuth client id from Google Cloud (".apps.googleusercontent.com"). Empty = Google sign-in disabled.
app.google.client-id=${GOOGLE_CLIENT_ID:}
# Comma-separated email domains allowed to register (e.g. gmail.com). Empty = any domain.
app.auth.allowed-email-domains=${ALLOWED_EMAIL_DOMAINS:}
# Brute-force protection: failed logins allowed per username+IP inside the window
app.auth.max-failed-logins=5
app.auth.lockout-minutes=15
# Accounts that never verified their email are deleted after this many hours (0 = never)
app.auth.unverified-retention-hours=${UNVERIFIED_RETENTION_HOURS:24}

# ---------- Email (OTP codes) ----------
# Brevo HTTP API key. If empty, emails are only written to the log (fine for local dev, not for prod).
app.mail.brevo-api-key=${BREVO_API_KEY:}
# Sender address verified in Brevo (e.g. your Gmail)
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:FreakCode}

# ---------- Ops ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.com.prepmind=INFO
