spring.application.name=prep-api
server.port=8080
# Render sits behind a proxy: trust X-Forwarded-* from internal hops so client IPs are correct
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never

# ---------- Database ----------
# Required in production: DB_HOST, DB_NAME, DB_USER, DB_PASS (no password fallback on purpose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:interview_prep_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Security ----------
# Required: a random string of at least 32 characters (e.g. `openssl rand -base64 48`). The app refuses to start without it.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://interview-preparation-platform-roan.vercel.app}
# Comma-separated usernames that get ROLE_ADMIN (can add questions). Empty = nobody.
app.admin.usernames=${ADMIN_USERNAMES:}
# Comma-separated email domains allowed to register (e.g. gmail.com). Empty = any domain.
app.auth.allowed-email-domains=${ALLOWED_EMAIL_DOMAINS:}
# Brute-force protection: failed logins allowed per username+IP inside the window
app.auth.max-failed-logins=5
app.auth.lockout-minutes=15

# ---------- Ops ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.com.prepmind=INFO
